<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة التلوين</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: linear-gradient(180deg, #FFB6C1 0%, #FF69B4 100%);
    font-family: Arial, Tahoma, sans-serif;
    text-align: center;
    padding: 15px;
    min-height: 100vh;
    color: #333;
}

h1 {
    color: #fff;
    text-shadow: 2px 2px 4px #C71585;
    font-size: 32px;
    margin: 8px 0 12px;
}

/* لوحة النقاط */
#scoreBoard {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 12px;
}

.scoreBox {
    background: white;
    border-radius: 18px;
    padding: 8px 16px;
    min-width: 120px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    font-size: 18px;
    font-weight: bold;
}

#score {
    color: #FFF1493;
}

#stars {
    color: #f5b400;
    font-size: 21px;
}

#completed {
    color: #008cba;
}

/* اختيار الرسومات */
#choices {
    margin: 12px 0;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
}

#choices button {
    background: white;
    color: #FFV893;
    border: none;
    padding: 11px 16px;
    margin: 3px;
    border-radius: 15px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 7px rgba(0,0,0,0.12);
    transition: 0.2s;
}

#choices button:hover {
    transform: translateY(-2px);
}

#choices button.active {
    background: yellow;
    color: #c71585;
}

/* الألوان */
#colors {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 15px auto;
    flex-wrap: wrap;
    max-width: 650px;
}

.color {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    border: 4px solid white;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    transition: 0.2s;
    touch-action: manipulation;
}

.color:hover {
    transform: scale(1.08);
}

.color.selected {
    border: 4px solid yellow;
    box-shadow: 0 0 15px yellow;
    transform: scale(1.12);
}

/* أزرار التحكم */
#controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 12px 0 18px;
    flex-wrap: wrap;
}

.controlBtn {
    border: none;
    border-radius: 16px;
    padding: 11px 20px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    background: white;
    color: #FF1493;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
}

.controlBtn:hover {
    transform: translateY(-2px);
}

/* مساحة الرسم */
#drawing {
    background: white;
    border-radius: 20px;
    padding: 15px;
    display: inline-block;
    max-width: 100%;
    box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    overflow: hidden;
}

#drawing svg {
    max-width: 100%;
    height: auto;
}

.part {
    cursor: pointer;
    transition: 0.25s;
}

.part:hover {
    opacity: 0.8;
}

/* الجزء الذي تشير إليه المساعدة */
.helpHighlight {
    animation: helpPulse 0.8s infinite alternate;
}

@keyframes helpPulse {
    from {
        opacity: 0.55;
        filter: drop-shadow(0 0 3px yellow);
    }
    to {
        opacity: 1;
        filter: drop-shadow(0 0 15px yellow);
    }
}

/* نافذة الإنجاز */
#successOverlay {
    position: fixed;
    inset: 0;
    background: rgba(255, 105, 180, 0.35);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 20px;
}

.successBox {
    background: white;
    border-radius: 28px;
    padding: 28px 25px;
    max-width: 390px;
    width: 100%;
    box-shadow: 0 10px 35px rgba(0,0,0,0.3);
    animation: popIn 0.4s ease;
}

.successBox .bigEmoji {
    font-size: 65px;
}

.successBox h2 {
    color: #FF1493;
    margin: 10px 0;
    font-size: 28px;
}

.successBox p {
    font-size: 19px;
    font-weight: bold;
}

.successStars {
    font-size: 35px;
    margin: 10px;
}

.successBox button {
    border: none;
    background: #FF1493;
    color: white;
    padding: 12px 25px;
    border-radius: 16px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

@keyframes popIn {
    from {
        transform: scale(0.6);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

/* قصاصات الاحتفال */
.confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    top: -20px;
    z-index: 1100;
    animation: fall 2.5s linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
    }
}

/* الهاتف */
@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    h1 {
        font-size: 27px;
    }

    #choices button {
        font-size: 16px;
        padding: 10px 12px;
    }

    .color {
        width: 42px;
        height: 42px;
    }

    .scoreBox {
        min-width: 105px;
        font-size: 16px;
        padding: 8px 11px;
    }

    #drawing {
        padding: 8px;
        width: 100%;
    }
}
</style>

function playTone(frequency, duration) {

    try {

        const AudioContext =
            window.AudioContext || window.webkitAudioContext;

        const audioContext = new AudioContext();

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.frequency.value = frequency;
        oscillator.type = "sine";

        gain.gain.value = 0.08;

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();

        setTimeout(() => {

            oscillator.stop();
            audioContext.close();

        }, duration);

    } catch(e) {}

}


/* =========================

    document.getElementById("score").textContent = score;

        stars = "⭐ ☆ ☆";

    if (score >= 60) {

    }

    if (score >= 100) {
        stars = "⭐ ⭐ ⭐";
    }

    document.getElementById("stars").textContent = stars;
}

/* =========================
   عرض الرسمة
========================= */

function showDrawing(type, evt) {

    currentDrawing = type;

    coloredParts = new Set();

    clearTimeout(helpTimer);

    document.getElementById("drawing").innerHTML =
        drawings[type];

    document
        .querySelectorAll("#choices button")
        .forEach(button =>
            button.classList.remove("active")
        );

    if (evt && evt.currentTarget) {
        evt.currentTarget.classList.add("active");
    }

}


/* =========================
   تلوين الأجزاء
========================= */

document
.getElementById("drawing")
.addEventListener("click", function(e) {

    if (!e.target.classList.contains("part")) {
        return;
    }

    const part = e.target;

    /*
       نستخدم معرفًا خاصًا للجزء حتى لا يحصل الطفل
       على نقاط إضافية عند الضغط عليه مرات متعددة.
    */

    if (!part.dataset.colored) {

        part.dataset.colored = "true";

        coloredParts.add(part);

        score += 10;

        updateScoreBoard();

        playTone(750, 100);

        checkCompletion();

    } else {

        // يسمح للطفل بتغيير لون الجزء
        playTone(500, 70);

    }

    part.setAttribute("fill", selectedColor);

    part.classList.remove("helpHighlight");

});


/* =========================
   معرفة اكتمال الرسمة
========================= */

function checkCompletion() {

    const parts =
        document.querySelectorAll("#drawing .part");

    if (
        parts.length > 0 &&
        coloredParts.size === parts.length
    ) {

        completedDrawings++;

        localStorage.setItem(
            "colorGameCompleted",
            completedDrawings
        );

        updateScoreBoard();

        playCompletionSound();

        createConfetti();

        setTimeout(() => {

            const names = {
                fish: "السمكة 🐟",
                butterfly: "الفراشة 🦋",
                house: "البيت 🏠",
                clown: "المهرج 🤡",
                tree: "الشجرة 🌳"
            };

            document.getElementById("successMessage").textContent =
                "لقد أكملت " + names[currentDrawing] + " بنجاح!";

            document.getElementById("successOverlay").style.display =
                "flex";

        }, 400);

    }

}


/* =========================
   صوت الإنجاز
========================= */

function playCompletionSound() {

    playTone(600, 120);

    setTimeout(() => playTone(750, 120), 150);

    setTimeout(() => playTone(900, 180), 300);

}


/* =========================
   الاحتفال
========================= */

function createConfetti() {

    const symbols = ["⭐", "🌸", "🎉", "✨", "💖"];

    for (let i = 0; i < 30; i++) {

        const confetti =
            document.createElement("div");

        confetti.className = "confetti";

        confetti.textContent =
            symbols[Math.floor(Math.random() * symbols.length)];

        confetti.style.left =
            Math.random() * 100 + "vw";

        confetti.style.fontSize =
            (15 + Math.random() * 18) + "px";

        confetti.style.animationDelay =
            Math.random() * 0.8 + "s";

        document.body.appendChild(confetti);

        setTimeout(() => {
            confetti.remove();
        }, 3500);

    }

}


/* =========================
   إغلاق شاشة الإنجاز
========================= */

function closeSuccess() {

    document.getElementById("successOverlay").style.display =
        "none";

}


/* =========================
   إعادة التلوين
========================= */

function resetDrawing() {

    coloredParts = new Set();

    clearTimeout(helpTimer);

    document.getElementById("drawing").innerHTML =
        drawings[currentDrawing];

}


/* =========================
   زر المساعدة
========================= */

function giveHelp() {

    clearTimeout(helpTimer);

    const parts =
        Array.from(
            document.querySelectorAll("#drawing .part")
        );

    const uncolored =
        parts.filter(
            part => !part.dataset.colored
        );

    if (uncolored.length === 0) {

        return;

    }

    const part =
        uncolored[0];

    part.classList.add("helpHighlight");

    playTone(850, 100);

    helpTimer = setTimeout(() => {

        part.classList.remove("helpHighlight");

    }, 2500);

}


/* =========================
   البداية
========================= */

updateScoreBoard();

showDrawing("fish");

</script>
